<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Song ❤️</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="song-page">

    <main class="song-container">

        <div class="music-heart">
            🎵
        </div>

        <h1>Our Little Song ❤️</h1>

        <p class="song-description">
            This song is for you, Omofolahan ❤️
        </p>

        <div class="music-player">

            <h2>Our Song</h2>

            <div class="music-controls">
                <button id="playButton" class="play-button">Play ▶️</button>
            </div>

            <audio controls id="globalAudio">
                <source src="music/our-song.mp3.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

        </div>

        <button
            class="next-button"
            onclick="goToPage('letter.html')">
            There's something I want to tell you 💌
        </button>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
